[project]
name = "hexlet-code"
version = "0.1.0"
description = "Flight booking API service"
readme = "README.md"
authors = [
    { name = "Dmitry", email = "xequrt@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

exclude = [
  "venv/",
  ".venv/",
  "__pycache__/",
  "tests/",
  "migrations/"
]